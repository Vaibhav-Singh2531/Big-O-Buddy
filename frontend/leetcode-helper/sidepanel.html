<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigO Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h2>BigO Buddy 🤖</h2>
      <p id="problem-context" class="context">Loading context...</p>
    </div>
    
    <div class="chat-history" id="chat-history">
      <div class="message ai-message">
        Hello! I'm BigO Buddy. I see you're working on a LeetCode problem. How can I help you today?
      </div>
    </div>
    
    <div class="input-area">
      <textarea id="user-input" placeholder="Ask a question about this problem... (e.g., Should I link odd then even?)" rows="2"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
